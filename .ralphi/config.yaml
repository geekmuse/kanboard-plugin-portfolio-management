# ralphi configuration
# Auto-generated — edit as needed

project:
  name: "kanboard-plugin-portfolio-mgmt"
  description: "A Kanboard plugin that adds cross-project portfolio management with grouped projects, shared milestones, and dependency visualization."
  language: "PHP"
  framework: "Kanboard Plugin"

commands:
  lint:    "bash scripts/docker-lint.sh"
  test:    "bash scripts/docker-test.sh"
  phpcs:   "bash scripts/docker-phpcs.sh"
  phpstan: "bash scripts/docker-phpstan.sh"
  # build: n/a — PHP templates render directly
  # typecheck: n/a — covered by phpstan

rules:
  - "BEFORE ANY CODING WORK each iteration: read docs/references/kanboard-plugin-development-guidelines.md — it contains critical agent feedback and known pitfalls from previous iterations of this project"
  - "use PicoDb query builder for all database queries — no raw SQL string interpolation"
  - "all templates escape output with $this->text->e() — never echo raw user input"
  - "all user-visible strings wrapped in t('...') for localization"
  - "CSS classes prefixed with portfolio- to avoid collisions"
  - "template hooks only — never use setTemplateOverride()"
  - "write only to plugin tables — never write to Kanboard core tables"
  - "schema migrations are versioned and append-only — never modify existing version_N() functions"
  - "every model method must have a corresponding unit test"
  - "require integration tests for all controller actions"
  - "follow PSR-12 coding standard (enforced via PHP_CodeSniffer)"
  - "maintain PHPStan level 5 compliance — no new baseline errors"

boundaries:
  never_touch:
    - "*.lock"
    - ".env*"
    - "Asset/js/d3.v7.min.js"
    - "docs/references/kanboard-plugin-development-guidelines.md"

engine: "pi"
max_retries: 3
