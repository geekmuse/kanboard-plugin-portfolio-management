name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: PHP syntax lint
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; > /tmp/lint-output.txt 2>&1
          if grep -q "Parse error\|Fatal error" /tmp/lint-output.txt; then
            grep "Parse error\|Fatal error" /tmp/lint-output.txt
            exit 1
          fi
          echo "All PHP files passed syntax check."

      - name: PHP_CodeSniffer (PSR-12)
        run: ./vendor/bin/phpcs --standard=.phpcs.xml

      - name: PHPStan (level 5)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml

  quality-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify quality matrix
        env:
          MATRIX_RESULT: ${{ needs.lint-and-test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Quality matrix failed: $MATRIX_RESULT"
            exit 1
          fi
