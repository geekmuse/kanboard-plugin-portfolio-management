name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2.37.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax lint
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; > /tmp/lint-output.txt 2>&1
          if grep -q "Parse error\|Fatal error" /tmp/lint-output.txt; then
            grep "Parse error\|Fatal error" /tmp/lint-output.txt
            exit 1
          fi
          echo "All PHP files passed syntax check."

      - name: PHP_CodeSniffer (PSR-12)
        run: ./vendor/bin/phpcs --standard=.phpcs.xml

      - name: PHPStan (level 5)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml
